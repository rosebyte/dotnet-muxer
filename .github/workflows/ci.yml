name: Native CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Cross-filesystem placement
        if: runner.os == 'Linux'
        env:
          MUXLET_TEST_FOREIGN_DIRECTORY: /dev/shm
        run: cargo test --locked --test placement artefacts_are_staged_on_the_filesystem_they_end_up_on -- --ignored
      - run: cargo build --locked --release --bins
      - run: cargo test --locked --release --all-targets
      - uses: actions/upload-artifact@v4
        with:
          name: muxlet-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/dotnet
            target/release/dotnet.exe
            target/release/muxlet-install
            target/release/muxlet-install.exe

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --locked --all-targets
